<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1340">
  <title>ForgeOne Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/docs/docs.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236c47ff'/><rect x='8' y='15' width='4' height='10' rx='1' fill='white'/><rect x='14' y='9' width='4' height='16' rx='1' fill='white'/><rect x='20' y='18' width='4' height='7' rx='1' fill='white'/></svg>">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="rail">
      <a class="brand" href="#/" aria-label="ForgeOne goals">
        <span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="4" height="9" rx="1"/><rect x="10" y="5" width="4" height="15" rx="1"/><rect x="16" y="14" width="4" height="6" rx="1"/></svg></span>
        <span><b>ForgeOne</b><small>Control Room</small></span>
      </a>
      <nav aria-label="Main">
        <span class="group">Work</span>
        <a href="#/" data-nav="work"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>Goals</a>
        <a href="#/inbox" data-nav="inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2.5-8h11L20 13v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg><span class="lbl-long">Needs you</span><span class="lbl-short">Inbox</span><span class="badge" id="inbox-badge" hidden></span></a>
        <a href="#/support" data-nav="support"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.6"/><path d="M5.6 5.6l3.9 3.9M14.5 14.5l3.9 3.9M18.4 5.6l-3.9 3.9M9.5 14.5l-3.9 3.9"/></svg>Support</a>
        <span class="group">Builder</span>
        <a href="#/builds" data-nav="builds"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Builds</a>
        <a href="#/quality" data-nav="quality"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16V9M12 16V5M17 16v-4"/><circle cx="17" cy="9" r="1.5"/></svg>Quality</a>
        <span class="group">Project</span>
        <a href="#/docs" data-nav="docs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg><span class="lbl-long">Project docs</span><span class="lbl-short">Docs</span></a>
        <span class="group">Health</span>
        <a href="#/errors" data-nav="errors" class="tab-hide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.2v.1"/></svg>Errors<span class="badge" id="err-badge" hidden></span></a>
      </nav>
      <div class="rail-foot" id="live"><b><span class="pulse" aria-hidden="true"></span>Live</b>Updated <time id="updated">just now</time>, refreshes every 15 s</div>
    </aside>
    <div class="work">
      <header class="topbar">
        <a class="m-brand" href="#/" aria-label="ForgeOne goals"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="4" height="9" rx="1"/><rect x="10" y="5" width="4" height="15" rx="1"/><rect x="16" y="14" width="4" height="6" rx="1"/></svg></span></a>
        <div class="crumbs" id="crumbs"></div>
        <span class="env"><span class="dot" aria-hidden="true"></span>cashgrab.online</span>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <header class="sheet-head">
      <h2 id="sheet-title">Model call</h2>
      <button class="icon-btn" id="sheet-close" aria-label="Close">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </aside>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
