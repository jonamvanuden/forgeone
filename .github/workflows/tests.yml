name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ForgeOne
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Git identity for the publishing tests
        run: |
          git config --global user.name "ForgeOne CI"
          git config --global user.email "ci@forgeone.invalid"
          git config --global init.defaultBranch main
      - name: Run the tests
        run: pytest -q
