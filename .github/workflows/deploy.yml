name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = pull, build and restart; restart = restart only"
        type: choice
        options: [deploy, restart]
        default: deploy

concurrency:
  group: deploy-forgeone
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          ACTION: ${{ github.event.inputs.action || 'deploy' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cmd="forgeone"
          if [ "$ACTION" = "restart" ]; then cmd="forgeone restart"; fi
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes deploy@"$HOST" "$cmd"
