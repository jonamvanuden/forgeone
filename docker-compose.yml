services:
  db:
    image: postgres:17
    container_name: forgeone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgeone
      POSTGRES_PASSWORD: ${FORGEONE_DB_PASSWORD:?set FORGEONE_DB_PASSWORD in .env}
      POSTGRES_DB: forgeone
    ports:
      - "127.0.0.1:5433:5432"   # localhost only; 5433 avoids clashing with any other Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro   # runs on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeone -d forgeone"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: